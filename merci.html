<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <title>Confirmation d'inscription</title>
  </head>
  <body>
    <div class="container">
      <div class="confirmation">
        <h2>Merci, votre inscription est confirmée !</h2>
        <p id="confirmation-username"></p>
        <a class="button-link" href="index.html">Retour au formulaire</a>
      </div>
    </div>

    <script>
      // Affiche le nom d'utilisateur transmis depuis le formulaire.
      function afficherNomUtilisateur() {
        const params = new URLSearchParams(window.location.search);
        const username = params.get('username');
        const usernameElement = document.getElementById('confirmation-username');

        usernameElement.textContent = username
          ? `Nom d'utilisateur : ${username}`
          : 'Nom d’utilisateur non renseigné.';
      }

      afficherNomUtilisateur();
    </script>
  </body>
</html>
